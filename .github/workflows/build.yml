name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Unit tests
        # DeviceIntegrationTests skip themselves on CI (no phone attached).
        run: swift test

      - name: Build app and DMG (unsigned, universal)
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Build app and DMG (unsigned, universal)
        run: VERSION="0.0.0-${GITHUB_SHA::7}" scripts/build-app.sh
        if: "!startsWith(github.ref, 'refs/tags/v')"

      - uses: actions/upload-artifact@v7
        with:
          name: AndroBridge-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --title "AndroBridge $GITHUB_REF_NAME" --notes "Unsigned, not notarized. See README → Installing."
