name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; the release step needs to create a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          swift --version

      - name: Unit tests
        # DeviceIntegrationTests skip themselves on CI (no phone attached).
        run: swift test

      - name: Build app and DMG (unsigned, universal)
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Build app and DMG (unsigned, universal)
        run: VERSION="0.0.0-${GITHUB_SHA::7}" scripts/build-app.sh
        if: "!startsWith(github.ref, 'refs/tags/v')"

      - uses: actions/upload-artifact@v4
        with:
          name: AndroBridge-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Release notes = this version's CHANGELOG section + install note.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on && !/^\[/ {print}' CHANGELOG.md > notes.md
          printf '\n---\n**Unsigned and not notarized.** First launch: System Settings → Privacy & Security → Open Anyway. Requires adb: `brew install --cask android-platform-tools`. See the README.\n' >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.sha256 --title "AndroBridge $GITHUB_REF_NAME" --notes-file notes.md
