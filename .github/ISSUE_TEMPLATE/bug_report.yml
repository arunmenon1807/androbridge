name: Bug report
description: Something doesn't work or a transfer went wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include any error text from the transfer panel or alert.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Connect phone over USB\n2. Copy DCIM/Camera to Downloads\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AndroBridge version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.2, MacBook Pro M3"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: "Pixel 8 Pro, Android 15"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [USB, Wi-Fi (Wireless debugging), Emulator]
    validations:
      required: true
  - type: input
    id: adb
    attributes:
      label: adb version
      description: Settings → adb shows it, or run `adb version`.
