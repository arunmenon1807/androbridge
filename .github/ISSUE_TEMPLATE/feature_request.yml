name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: roadmap
    attributes:
      label: Checked the roadmap
      options:
        - label: I looked at docs/ROADMAP.md (Finder integration and MTP mode are already listed there).
